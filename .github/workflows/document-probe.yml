name: document probe

# Weekly and manual. Opens the source's listing page in a stock headless
# Chromium (no agent override, no plugins, no cookies of its own), reads the
# current listing through that page, then opens the first five documents it
# names; reports each one's status, final address, time, size, whether the
# bulletin's id and its affected products appear, and whether the answer
# looks like a challenge or a denial. A refusal is reported, not worked
# around. Stores nothing.
# Set the three repository secrets SITE_URL, LISTING_CURRENT_URL and
# DOCUMENT_BASE (Settings → Secrets and variables → Actions → Secrets); they
# are masked in every log.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: refuse without the source secrets
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          LISTING_CURRENT_URL: ${{ secrets.LISTING_CURRENT_URL }}
          DOCUMENT_BASE: ${{ secrets.DOCUMENT_BASE }}
        shell: bash
        run: |
          missing=0
          for n in SITE_URL LISTING_CURRENT_URL DOCUMENT_BASE; do
            if [ -z "${!n}" ]; then echo "::error::repository secret $n is not set"; missing=1; fi
          done
          exit $missing
      - name: install the browser driver matching the image
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save --no-audit --no-fund playwright@1.64.0
      - name: probe
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          LISTING_CURRENT_URL: ${{ secrets.LISTING_CURRENT_URL }}
          DOCUMENT_BASE: ${{ secrets.DOCUMENT_BASE }}
        run: node scripts/document-probe.mjs
